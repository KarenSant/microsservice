server:
  port: 8080

spring:
  profiles:
    active: local

  datasource:
    url: DB_URL
    username: {DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect

  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss

logging:
  level:
    root: INFO
    com.hubspot: DEBUG