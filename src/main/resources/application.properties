#Porta do servidor
server.port=SERVER_PORT:8080

#Perfil ativo (local, dev, prod)
spring.profiles.active={SPRING_PROFILES_ACTIVE:local}

#Log
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.hubspot=${LOG_LEVEL_MICROSSERVICE_WINE:DEBUG}

#Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/microsservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.url=spring.datasource.url=jdbc:mysql://localhost:3306/microsservice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA
#AVISO: A propriedade abaixo deve ser alterada para 'update' em produção para evitar perda de dados.
spring.jpa.properties.hibernate.bytecode.provider=bytebuddy
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
#spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect